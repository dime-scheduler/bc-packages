name: Feed

# Rebuilds the static NuGet feed on GitHub Pages from this repository's releases. The
# bc-connector publish workflow creates a release here for every connector version, which
# triggers this. See scripts/Build-Feed.ps1 for the feed layout and why it exists.
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/feed.yml
      - scripts/Build-Feed.ps1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build feed
        shell: pwsh
        # FEED_BASE_URL is a repository variable; set it once a custom domain is configured.
        run: ./scripts/Build-Feed.ps1 -SiteRoot site -Repo ${{ github.repository }} -BaseUrl "${{ vars.FEED_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
